# Starts the whole system with one command:  docker compose up -d --build
#   API        -> http://localhost:8000
#   Prometheus -> http://localhost:9090
#   Grafana    -> http://localhost:3000
services:
  api:
    build: ./app                      # build the image from app/Dockerfile
    container_name: weather-api
    ports:
      - "8000:8000"                   # host port : container port
    environment:
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-600}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./prometheus:/etc/prometheus:ro     # prometheus.yml + alerts.yml
      - prometheus-data:/prometheus   # keep collected data when containers restart
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      # Login comes from your .env file (never commit .env!). Defaults: admin / admin
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-telemetry.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # datasource + dashboard loader
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro   # our dashboard JSON
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
